<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');

      .bg {
        fill: #050505;
        stroke: #1f2430;
        stroke-width: 1.5;
      }

      .titlebar {
        fill: #12151a;
      }

      .term-title {
        fill: #7a7a7a;
        font-family: 'Space Mono', 'Fira Code', 'Courier New', Consolas, monospace;
        font-size: 11.5px;
      }

      .term-text {
        font-family: 'Space Mono', 'Fira Code', 'Courier New', Consolas, monospace;
        font-size: 13.5px;
        letter-spacing: 0.3px;
      }

      .user-host {
        fill: #27c93f;
        font-weight: 700;
      }

      .sep {
        fill: #555555;
      }

      .path {
        fill: #00f0ff;
      }

      .dollar {
        fill: #ff0055;
        font-weight: 700;
      }

      .cmd {
        fill: #FCEE0A;
        font-weight: 700;
      }

      .out-status {
        fill: #00f0ff;
      }

      .out-interest {
        fill: #e6edf3;
      }

      .bullet {
        fill: #00f0ff;
        font-weight: 700;
      }

      .nmap-head {
        fill: #7d8590;
        font-weight: 700;
      }

      .nmap-port {
        fill: #00f0ff;
      }

      .nmap-open {
        fill: #27c93f;
        font-weight: 700;
      }

      .nmap-svc {
        fill: #f0f6fc;
      }

      .cursor {
        animation: blink 0.8s infinite step-end;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .scanline {
        fill: url(#scanline-grad);
        opacity: 0.10;
        animation: scroll-scanline 6s infinite linear;
      }

      @keyframes scroll-scanline {
        from { transform: translateY(-100%); }
        to { transform: translateY(100%); }
      }
</style>
    
    <linearGradient id="scanline-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

  </defs>

  <rect class="bg" width="100%" height="100%" rx="8" />
  <!-- Titlebar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 792,0 A 8,8 0 0,1 800,8 L 800,30 L 0,30 Z" class="titlebar" />
  <line x1="0" y1="30" x2="800" y2="30" stroke="#1f2430" stroke-width="1" />
  <circle cx="20" cy="15.0" r="6" fill="#ff5f56" />
  <circle cx="40" cy="15.0" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="15.0" r="6" fill="#27c93f" />
  <text x="400.0" y="19.0" class="term-title" text-anchor="middle">athx1337@netrun: ~ (status)</text>

  <text x="25" y="58" class="term-text"><tspan class="user-host">athx1337@netrun</tspan><tspan class="sep">:</tspan><tspan class="path">~</tspan><tspan class="dollar">$ </tspan><tspan class="cmd">echo $STATUS</tspan></text>
  <text x="25" y="80" class="term-text out-status">stargazing.</text>

  <rect class="scanline" width="100%" height="100" rx="8" pointer-events="none" />
</svg>