<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
      
      .bg {
        fill: #030303;
      }
      
      .title {
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 42px;
        fill: #FCEE0A;
      }
      
      .subtitle {
        font-family: 'Space Mono', monospace;
        font-weight: 400;
        font-size: 18px;
        fill: #00f0ff;
      }
      
      .terminal {
        font-family: 'Space Mono', monospace;
        font-size: 14px;
        fill: #ff0055;
      }
      
      /* Glitch Effect */
      .glitch {
        animation: glitch-anim 4s infinite linear alternate-reverse;
      }
      
      @keyframes glitch-anim {
        0% {
          text-shadow: -2px 0 #00f0ff, 2px 0 #ff0055;
          transform: translate(0);
        }
        2% {
          text-shadow: -5px -2px #00f0ff, 5px 2px #ff0055;
          transform: translate(-1px, 1px);
        }
        4% {
          text-shadow: 2px 2px #00f0ff, -2px -2px #ff0055;
          transform: translate(1px, -1px);
        }
        6% {
          text-shadow: -2px 0 #00f0ff, 2px 0 #ff0055;
          transform: translate(0);
        }
        100% {
          text-shadow: -2px 0 #00f0ff, 2px 0 #ff0055;
          transform: translate(0);
        }
      }
      
      /* Blinking Cursor */
      .cursor {
        animation: blink 1s infinite step-end;
      }
      
      @keyframes blink {
        50% { opacity: 0; }
      }
      
      /* Glowing Pulse */
      .pulse-line {
        stroke: #ff0055;
        stroke-width: 2;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: draw 3s infinite ease-in-out;
      }
      
      @keyframes draw {
        0% { stroke-dashoffset: 800; }
        50% { stroke-dashoffset: 0; stroke: #00f0ff; }
        100% { stroke-dashoffset: -800; }
      }
    </style>
  </defs>
  
  <rect class="bg" width="100%" height="100%" rx="8" />
  
  <!-- Decorative Grid Lines -->
  <line x1="20" y1="20" x2="780" y2="20" stroke="#1f1f1f" stroke-width="1" />
  <line x1="20" y1="180" x2="780" y2="180" stroke="#1f1f1f" stroke-width="1" />
  
  <!-- Terminal Prompt -->
  <text x="40" y="55" class="terminal">[athx1337@netrun ~]$ <tspan class="subtitle">run system_override.sh</tspan></text>
  
  <!-- Glitch Title -->
  <text x="40" y="115" class="title glitch">ATHX1337</text>
  <text x="240" y="115" class="subtitle">// NETRUNNER SECURE PROFILE<tspan class="cursor">_</tspan></text>
  
  <!-- Animated Pulse Border Line -->
  <path d="M 20 150 L 780 150" class="pulse-line" />
</svg>
