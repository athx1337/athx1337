<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
      
      .bg {
        fill: #050505;
      }
      
      .text-log {
        font-family: 'Space Mono', monospace;
        font-size: 13px;
        fill: #00f0ff;
        opacity: 0;
        animation: fadeInLine 0.4s forwards;
      }
      
      .ascii {
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 15px;
        fill: #FCEE0A;
        white-space: pre;
        opacity: 0;
        animation: fadeInLine 0.4s forwards;
      }

      .terminal-prompt {
        font-family: 'Space Mono', monospace;
        font-size: 13px;
        fill: #ff0055;
        opacity: 0;
        animation: fadeInLine 0.4s forwards;
      }
      
      /* Staggered Line Animation Delays */
      .line1 { animation-delay: 0.1s; }
      .line2 { animation-delay: 0.4s; }
      .line3 { animation-delay: 0.7s; }
      
      /* Staggered ASCII Art Delays */
      .ascii-1 { animation-delay: 1.0s; }
      .ascii-2 { animation-delay: 1.1s; }
      .ascii-3 { animation-delay: 1.2s; }
      .ascii-4 { animation-delay: 1.3s; }
      .ascii-5 { animation-delay: 1.4s; }
      
      .line9 { animation-delay: 1.7s; }
      .line10 { animation-delay: 2.0s; }
      
      @keyframes fadeInLine {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      /* Blinking Cursor */
      .cursor {
        animation: blink 0.8s infinite step-end;
      }
      
      @keyframes blink {
        50% { opacity: 0; }
      }
      
      /* Scanline Effect Overlay */
      .scanline {
        fill: url(#scanline-grad);
        opacity: 0.15;
        animation: scroll-scanline 6s infinite linear;
      }
      
      @keyframes scroll-scanline {
        from { transform: translateY(-300px); }
        to { transform: translateY(300px); }
      }
    </style>
    
    <linearGradient id="scanline-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <rect class="bg" width="100%" height="100%" rx="8" />
  
  <!-- Terminal Header / Titlebar -->
  <rect width="100%" height="30" fill="#151515" rx="8" />
  <circle cx="20" cy="15" r="6" fill="#ff5f56" />
  <circle cx="40" cy="15" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="15" r="6" fill="#27c93f" />
  <text x="400" y="20" fill="#7a7a7a" font-family="'Space Mono', monospace" font-size="12" text-anchor="middle">athx1337@netrun: ~ (zsh)</text>
  
  <!-- Terminal logs output -->
  <text x="30" y="60" class="text-log line1">[+] INITIALIZING BREACH PROTOCOL...</text>
  <text x="30" y="80" class="text-log line2">[+] BYPASSING SENTINEL CORPO FIREWALLS...</text>
  <text x="30" y="100" class="text-log line3">[+] CORRUPTING NODE CORES... DECRYPTING ALIAS...</text>
  
  <!-- ASCII Art Title Banner (Staggered Load) -->
  <text x="30" y="130" class="ascii ascii-1">    ___   ______  __  __ _  __   ____   _____  _____  _____ </text>
  <text x="30" y="148" class="ascii ascii-2">   /   | /_  __/ / / / /| |/ /  /  _/  |__  / |__  / |___  |</text>
  <text x="30" y="166" class="ascii ascii-3">  / /| |  / /   / /_/ / |   /   / /     /_ &lt;   /_ &lt;    / /  </text>
  <text x="30" y="184" class="ascii ascii-4"> / ___ | / /    / __  / / /\ \  _/ /   ___/ / ___/ /   / /   </text>
  <text x="30" y="202" class="ascii ascii-5">/_/  |_|/_/    /_/ /_/_/  \_\/___/   /____//____/   /_/      </text>
  
  <text x="30" y="235" class="text-log line9">[+] ACCESS GRANTED. HELLO CHIPPIN!</text>
  
  <!-- Dynamic Blinking Cursor Prompt -->
  <text x="30" y="265" class="terminal-prompt line10">athx1337@netrun:~$ <tspan fill="#FCEE0A">./observing.sh</tspan><tspan class="cursor" fill="#00f0ff">_</tspan></text>
  
  <!-- Scanline Overlay -->
  <rect class="scanline" width="100%" height="300" pointer-events="none" />
</svg>
